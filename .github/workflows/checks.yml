name: Backend and Linux deployment checks
on: [push, pull_request, workflow_dispatch]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.20"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check static/js/dashboard.js
      - name: Verify Gunicorn, model, SQLite, and APIs on Linux
        env:
          PORT: "8765"
          DATA_DIR: ${{ runner.temp }}/battery-gunicorn
        run: |
          gunicorn app:app > "$RUNNER_TEMP/battery-gunicorn.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health; then break; fi
            sleep 1
          done
          python tests/http_smoke.py http://127.0.0.1:8765
          cat "$RUNNER_TEMP/battery-gunicorn.log"
